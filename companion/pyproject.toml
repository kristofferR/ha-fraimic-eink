[project]
name = "fraimic-backend"
version = "0.1.0"
description = "Private stock-firmware transport for the Fraimic Home Assistant integration"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.12,<4"]

[project.scripts]
fraimic-backend = "fraimic_backend.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["fraimic_backend"]
