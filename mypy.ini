# Run with the Home Assistant test requirements installed (see AGENTS.md):
#   uv run --python 3.14 --with-requirements requirements_test.txt mypy
#
# Three tiers, ratcheted toward strict:
#   1. Baseline (every module): the [mypy] section below.
#   2. Strict: modules listed in the strict section. Add a module once it
#      passes; never remove one.
#   3. Relaxed: modules that still fail the baseline on specific error codes.
#      Fix the module, then delete its section.

[mypy]
python_version = 3.14
files = custom_components/fraimic, tests_ha
explicit_package_bases = true
show_error_codes = true
check_untyped_defs = true
extra_checks = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
enable_error_code = ignore-without-code, redundant-self, truthy-iterable

# Tier 2: strict. Equivalent to --strict for these modules.
[mypy-custom_components.fraimic.api,custom_components.fraimic.art_packs,custom_components.fraimic.cloud,custom_components.fraimic.const,custom_components.fraimic.delivery,custom_components.fraimic.diagnostics,custom_components.fraimic.frame_name,custom_components.fraimic.http_helpers,custom_components.fraimic.info_page,custom_components.fraimic.library_model,custom_components.fraimic.log_page,custom_components.fraimic.pack_model,custom_components.fraimic.playlists,custom_components.fraimic.power,custom_components.fraimic.registry,custom_components.fraimic.scene_model,custom_components.fraimic.scheduled_events,custom_components.fraimic.screens_editor,custom_components.fraimic.source,custom_components.fraimic.providers.base,custom_components.fraimic.providers.bing,custom_components.fraimic.providers.cache,custom_components.fraimic.providers.caption,custom_components.fraimic.providers.curation,custom_components.fraimic.providers.engine,custom_components.fraimic.providers.met,custom_components.fraimic.providers.pexels,custom_components.fraimic.providers.picsum,custom_components.fraimic.providers.reframed,custom_components.fraimic.providers.smk,custom_components.fraimic.providers.unsplash,custom_components.fraimic.providers.wallhaven,custom_components.fraimic.providers.wikimedia,custom_components.fraimic.render,custom_components.fraimic.render.compose,custom_components.fraimic.render.context,custom_components.fraimic.render.icons,custom_components.fraimic.render.layout,custom_components.fraimic.render.playlist,custom_components.fraimic.render.svg,custom_components.fraimic.render.theme,custom_components.fraimic.render.widgets,custom_components.fraimic.render.widgets.agenda,custom_components.fraimic.render.widgets.base,custom_components.fraimic.render.widgets.picture,custom_components.fraimic.render.widgets.weather]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true

# The test harness ships no type information.
[mypy-pytest_homeassistant_custom_component.*]
ignore_missing_imports = true

# Tier 3: relaxed. Each disables only the codes the module still fails.
[mypy-custom_components.fraimic.config_flow]
disable_error_code = arg-type, assignment

[mypy-custom_components.fraimic.render.display]
disable_error_code = arg-type, assignment, attr-defined

# Home Assistant service responses are typed as a JSON union.
[mypy-custom_components.fraimic.render.fetch]
disable_error_code = index, union-attr

[mypy-custom_components.fraimic.scheduler]
disable_error_code = arg-type, union-attr

[mypy-custom_components.fraimic.send_queue]
disable_error_code = arg-type, index, operator, union-attr

[mypy-custom_components.fraimic.services]
disable_error_code = dict-item, misc, union-attr
